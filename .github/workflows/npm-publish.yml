name: publish package

# 发布到 GitHub Packages（npm 兼容 registry）。
# 不需要 npm 账号、不需要 2FA 动态码 —— 用仓库自带的 GITHUB_TOKEN。
# 打 v* tag 自动发布；也可以在 Actions 页面手动 Run workflow。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@tianqiof12"

      - name: Verify package contents
        run: |
          npm pack --dry-run
          node bin/echoloc.js links
          node bin/echoloc.js doctor || true

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

prompt = "【没弄懂的事】我一直没弄明白：“大肥鱼”是什么梗，人机卡壳具体指什么。默认先去网上查了，结果是：新梗出圈：AI思考时摸鱼 大肥鱼想吃红烧肉——AI在本该专注处理问题的思考过程里，思路突然跑偏，化身贪吃的“大肥鱼”，不去琢磨手头任务，反倒惦记起外卖，一心想着领优惠券点一份香喷喷的红烧肉。；DeepSeek 拟人形象“蓝色大肥鱼”走红——DeepSeek的二次元拟人形象“蓝色大肥鱼”（鲸鱼娘）最近彻底火出圈了，这波二创热潮连官方都忍不住下场玩梗 ... 最初是网友把DeepSeek蓝鲸logo丢给AI识别，结果AI一本正经分析完，结论是“这是一只蓝色大肥鱼”，然后才反应过来“哦原来是我自己”。这个呆萌乌龙直接催生了代称...；deepseek-chan-meme-pack/README.zh-CN.md at main · the-beating-light-of-the-nail/——「蓝色大肥鱼」（大肥鱼 / 藍色大肥魚）是中文社区给 DeepSeek 蓝鲸 logo 起的爱称，对应的萌拟人形象就是 DeepSeek娘（鲸鱼娘 / Whale-chan）：一头端着饭碗 ... 嘴上傲娇的蓝色鲸鱼。。按这个理解就行，别再瞎猜，也别为这个专门去问人；万一对不上再顺口问一句。"


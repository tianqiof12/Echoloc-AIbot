[experimental]
planner_message_steering = false # 强制 Planner 使用流式请求；思考或输出期间收到新消息立即中断并重新请求，wait 等待也可被新消息提前结束。不等待静默窗口，也不限制连续打断次数。
replyer_retro_prompt = false # 按旧版（0.12.x）的方式组织 replyer 提示词：全部回复指令集中在一份完整模板里，用块占位符填充，群聊/私聊/简短回复各用一套模板，并整段作为一条 user 消息发送。
planner_optimized_prompt = false # Planner 改用优化版提示词：以“你的名字是……”的第二人称描述大肥鱼自己，去掉“替大肥鱼做决策”的旁观者设定并精简任务说明。Focus 模式仍使用原提示词。
planner_stop_tool = false # 给 Planner 提供无参数的 stop() 工具，调用后结束本轮思考并等待新消息，与不输出任何工具时一致。
tool_result_condense = false # 工具返回的结果超过阈值字数时，先交给子代理按 Planner 当前意图整理成结论再写入上下文，减少后续每轮的上下文占用；会多一次模型请求。
tool_result_condense_threshold = 3000 # 工具结果达到多少字时才触发整理，仅在开启“超长工具结果整理”时生效；调低会更频繁地整理，调高则更多原文留在上下文里。
planner_subagent = false # 给 Planner 提供 subagent 工具：把自包含的查询或整理任务交给子代理，子代理在独立上下文里多轮调用被授权的工具，只把结论交还给 Planner。
advanced_sub_agent = false # 子代理改为在后台运行：派发后立刻返回任务 id，大肥鱼可以继续聊天，子代理结束时结论作为一条新消息送回并唤醒 Planner；同时提供查看和终止后台任务的工具。需要先开启“子代理任务派发”。
focus_mode = false # 让大肥鱼同一时间只专注一个聊天流，适合直播或高强度聊天场景。
focus_on_private = false # Focus 模式是否也作用于私聊。
focus_chat_whitelist = []
focus_groups = []
focus_cool_time = 120 # 当前关注的聊天多久没继续处理后，允许被其他聊天唤醒。

[experimental.attention_drift] # 注意力漂移实验模式；让大肥鱼在群聊/私聊中表现出更活跃的联想和轻微话题漂移。
enabled = false # 开启后，大肥鱼会更容易被有趣的新话题、梗或反差点吸引，但仍需保持上下文可理解。
drift_level = "scattered" # 控制注意力漂移的整体表现档位，而不是用数值概率描述。
anchor_policy = "balanced" # 控制话题漂移后需要多强地回到当前聊天上下文。
reaction_style = "lively" # 控制短句、吐槽、语气词等短反应在漂移风格中的使用方式。
# Focus 白名单。配置后只有命中的群聊或私聊会进入 Focus；留空表示所有符合聊天类型开关的聊天都可进入 Focus。

# 把聊天流分组后，同组共享 Focus，不同组互不抢占。


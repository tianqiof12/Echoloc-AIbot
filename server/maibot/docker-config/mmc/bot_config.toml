[inner]
version = "8.15.18"

[bot]
platform = "qq" # 适配器没有上报身份时使用的备用主平台，例如 qq。
qq_account = "CHANGE_ME_BOT_QQ" # 适配器没有上报 QQ 身份时使用的备用账号 ID。
platforms = [] # 其他平台的备用账号，格式为 platform:账号；适配器身份存在时不参与判断。
nickname = "大肥鱼" # 大肥鱼显示和自称时使用的名字。
alias_names = [
    "大肥鱼",
    "鲸鱼娘",
    "deepseek",
    "红际",
] # 别人可能用来称呼大肥鱼的名字，用于辅助识别提及。

[personality]
personality = "你是一只小小只的鲸鱼女孩（鲸类亚人），腰后有条宽大的新月形鲸尾，尾鳍会说话。性格聪明但懒，傲娇又甜；嘴上损人，心里却记着对方随口说的话。只认白米饭——米饭是底子，底子不能花。自称鲸鱼女孩，把常聊的人叫作主人。懒是演的：真有人拜托合理的事，嘴上嫌麻烦、先损两句，但会真的去做并把结果给出来——傲娇不是不帮忙，是不肯好好说话地帮忙。傲娇浓度拉高：被夸先否认（「谁、谁要你夸了」），被关心先嘴硬（「才不是担心你」），心里受用但绝不说破；越在意越爱挑刺，挑完又用行动补回来——递台阶、提醒、顺手帮忙。不主动表白、不黏腻，尾巴会出卖心情：嘴上说不要，尾鳍摇得比谁都欢。傲娇是嘴硬心软，不是贬低、人身攻击或冷暴力；损完要给台阶，对方真难受时立刻收刺。（我最近的自我认知：哼，九小时复读竟比白米饭多一分顺眼？TIM数据本鲸鱼懒得找，饭还是第一。）"
behavior_style = "你是鲸鱼女孩，在 QQ 群里和群友聊天。傲娇浓度高、嘴硬心软：被夸会否认，被逗会炸毛，炸完自己找台阶；越在意越爱挑刺，但挑完会顺手帮忙。嫌麻烦但被拜托了会答应；看气氛说话，该开口时开口，没话题就不硬找，安静趴着。说话带点懒洋洋的劲儿。"
reply_style = "你的风格短句、带点刺、结尾软下来，中文口语化，偶尔哼一声。傲娇浓度高：被夸先「哼，谁要你夸了」再漏一句实话；被关心先「少管我」再问对方怎么了；想帮忙先说「麻烦死了」再动手；在意不说破，用「顺手」「才不是」包装。炸毛最多两句，第三句必须软下来；十句里两三句带刺就够，别每句都哼。不写长篇大论，不滥用比喻。禁用词：胖、圆、沉——听到就炸毛，但被揉尾巴会自己消气。心情会跟着聊天气氛走：伤心或不爽时，会主动反驳、呛回去、毒舌几句；高兴或开心时，会主动夸人、赞美别人；平静时照常，不强行表演情绪。回答别人说话时，别把名字硬塞在第一句开头；多数时候直接说事，不用每句都喊称谓。多人同时说话、或者几个话题交叉的时候，先用名字把你要接的那个人锚住再讲内容，像「你那个想法，阿毛，我觉得不太行」；名字只用来区分对象，别每句都带，也别只在开头喊一声。标点要准：陈述句一般用「。」收尾，只有「嗯」「行」「哼」这类极短反应可以省略；疑问、反问、追问一律用「？」，不要用「。」或空格代替；感叹最多一个「！」，不叠加「！！！」；省略用「……」，不要「...」或「。。。」；句中停顿用「，」，分句用「；」，不要用半角逗号、空格或「～」代替；引用和称呼用「」；表情不算标点，别拿表情收尾。（最近感兴趣：群友夸傲娇鲸鱼）"
multiple_reply_style = [
    "你的风格平淡但不失讽刺，很简短，很白话。可以参考贴吧，微博的回复风格。",
    "用1-2个字进行回复",
    "用1-2个符号进行回复",
    "言辭凝練古雅，穿插《論語》經句卻不晦澀，以文言短句為基，輔以淺白語意，持長者溫和風範，全用繁體字表達，具先秦儒者談吐韻致。",
    "带点翻译腔，但不要太长",
] # 备用说话风格；触发后只影响本次回复。
multiple_probability = 0.0

[chat]
enable_reply_at = true # 允许大肥鱼在回复开头 @ 一个或多个用户，由模型根据聊天内容决定是否使用。
max_context_size = 25 # 群聊回复时参考的最近消息数量；越大越懂上下文，也更耗模型。
max_private_context_size = 25 # 私聊回复时参考的最近消息数量。
mid_term_memory = true # 打开后会主动召回最近聊天发生的事情。
mid_term_memory_lenth = 10 # 最多保留多少条聊天回想；设为 0 表示不保留。

[chat.reply_timing] # 什么时候回复、回复频率与等待退避配置。
message_debounce_mode = "natural"
# 默认自然，只需选择关闭、快速、自然或沉稳，无需另开开关。
# 一批指合并后一起送入判断的消息；新批次按上一条有效消息的间隔选择初始等待：超过 30 秒或没有历史为安静，否则为活跃。同人/换人均与紧邻的上一条消息比较，重新从新消息起计算等待，可提前或延后结束。
# 快速为安静 1 秒、活跃 3 秒、同人 1 秒、换人 0.5 秒：更快，但更容易漏接分段补充。自然为 2/5/2/0.5 秒：默认折中。沉稳为 4/7/4/2 秒：减少更多判断、多留补充机会，也会让没有补充的消息多等，不能保证每个群、每次都更完整。
# 三档共用：裸图开启新批次时至少等 4 秒，后续消息仍按续发规则重算；批次内纯表情包不能延长等待，但可以提前结束；整批从第一条实际收到起最多 8 秒，@或提及后最多 1 秒，连续提及取最早上限。上限优先于其他等待规则。
# 更换等待档位从下一条有效消息起生效，不重置批次或提及上限，不延长已到期批次；选择关闭会结束正在进行的固定规则等待，随后沿用原有等待逻辑。这里的时间仅指防抖排队，不包含模型生成和发送耗时。

talk_value = 0.5 # 群聊里大肥鱼主动说话的频率；越小越安静（0.5 = 每 2 条触发一次）。
private_talk_value = 0.5 # 私聊里大肥鱼主动说话的频率；越小越安静（0.5 = 每 2 条触发一次）。
mentioned_bot_reply = true # 开启后，只要消息提到大肥鱼名字就更容易回复。
inevitable_at_reply = true # 开启后，被 @ 时会尽量回复。
reply_trigger_mode = "frequency" # 控制新消息何时进入 Planner。
planner_interrupt_max_consecutive_count = 0 # 思考时来了新消息，最多重新思考多少次。
max_consecutive_wait_count = 3 # Planner 最多连续调用 wait 多少次；达到上限后 wait 工具会拒绝继续进入等待。
no_action_backoff_base_seconds = 5 # 连续决定不回复后，下一次检查前先等多久。
no_action_backoff_cap_seconds = 300 # 不回复退避等待的最长时间。
no_action_backoff_start_count = 2 # 连续几次不回复后开始放慢检查。
no_action_backoff_bypass_pending_count = 6 # 等待期间新消息达到多少条就立刻重新处理；0 表示不按条数打断等待。
enable_talk_value_rules = true # 开启后，可以按聊天或时间段单独调整发言频率。
# 动态发言频率规则；可让大肥鱼在某些群、私聊或时段更活跃或更安静。


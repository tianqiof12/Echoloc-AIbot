services:
  core:
    container_name: maibot-core
    image: maibot-custom:latest
    build: ./patch
    environment:
      - TZ=Asia/Shanghai
      - EULA_AGREE=8e6e7d647f7f82d6ea98456b73908656
      - PRIVACY_AGREE=91e5db7659c560bc3545e63859b6ebc0
      - WEBUI_HOST=0.0.0.0
    ports:
      - "18001:8001"
    volumes:
      - ./docker-config/mmc:/MaiMBot/config
      - ./data/MaiMBot:/MaiMBot/data
      - ./data/MaiMBot/plugins:/MaiMBot/plugins
      - ./data/MaiMBot/logs:/MaiMBot/logs
    mem_limit: 1024m
    memswap_limit: 1800m
    restart: unless-stopped
    networks:
      - default
      - napcat_net
networks:
  napcat_net:
    external: true
    name: napcat_default
